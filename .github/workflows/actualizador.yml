name: Actualizador Automático de Precios

on:
  # Se ejecuta automáticamente todos los días a las 3:00 AM UTC (12:00 AM de Argentina)
  schedule:
    - cron: '0 3 * * *'
  # Nos permite ejecutar el bot manualmente con un botón desde la página de GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-base-de-datos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar el entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías (requests y beautifulsoup4)
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Ejecutar el Scraper de VORTEX
        run: |
          cd scraper
          python bot.py

      - name: Guardar y subir los nuevos precios a la Web
        run: |
          git config --global user.name "Vortex Bot"
          git config --global user.email "bot@comparador-tech.com"
          git add web/public/productos_db.json
          # Si no hay cambios en los precios, no hace nada. Si los hay, los sube.
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de precios" && git push)